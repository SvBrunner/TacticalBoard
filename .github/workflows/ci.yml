# CI and image publishing (arc42 ch. 7, ADR-016, docs/deployment.md).
#
#  - Every pull request and every push: frontend (check, test, build) and backend (build with
#    warnings as errors, unit + integration tests), then a test build of both images (linux/amd64,
#    not pushed).
#  - Pushes to master and version tags vX.Y.Z: after CI passed, both images are built for
#    linux/amd64 and linux/arm64 and pushed to the GitHub Container Registry (ghcr.io).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# Jobs ask for more where they need it (only the publish job writes packages).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs of branches and pull requests are cancelled; master and tags run to the end.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Keep in line with frontend/Dockerfile (node:24-slim, pnpm@11.25.0).
  NODE_VERSION: "24"
  PNPM_VERSION: "11.25.0"

jobs:
  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build

  backend:
    name: Backend (build, unit + integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      # Directory.Build.props already treats warnings as errors; the switch makes it explicit.
      - run: dotnet build --no-restore --configuration Release --warnaserror
      # The integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - run: dotnet test --no-build --configuration Release

  # Pull requests and branch pushes: prove that both images still build (no push).
  images:
    name: Image test build (${{ matrix.component }})
    needs: [frontend, backend]
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
    uses: ./.github/workflows/image.yml
    with:
      component: ${{ matrix.component }}
      push: false

  # Pushes to master and version tags: build for amd64 + arm64 and push to ghcr.io.
  publish:
    name: Publish image (${{ matrix.component }})
    needs: [frontend, backend]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      component: ${{ matrix.component }}
      push: true
