# Production deployment example (docs/deployment.md, arc42 ch. 7).
#
#   cp .env.example .env    # then fill in every required value
#   docker compose up -d
#
# Runs the published images behind a gateway (Caddy) that serves the whole app under one origin
# on ${TACTICALBOARD_HTTP_BIND}:${TACTICALBOARD_HTTP_PORT} (default 127.0.0.1:8080). Point your
# TLS-terminating reverse proxy at it. Bring your own OpenID Connect provider; none is started here.
name: tacticalboard-production

x-restart: &restart
  restart: unless-stopped

services:
  gateway:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - "${TACTICALBOARD_HTTP_BIND:-127.0.0.1}:${TACTICALBOARD_HTTP_PORT:-8080}:8080"
    environment:
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    <<: *restart
    image: ghcr.io/svbrunner/tacticalboard-frontend:${TACTICALBOARD_VERSION:-latest}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    <<: *restart
    image: ghcr.io/svbrunner/tacticalboard-backend:${TACTICALBOARD_VERSION:-latest}
    environment:
      ConnectionStrings__TacticalBoard: "Host=db;Port=5432;Database=tacticalboard;Username=tacticalboard;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      Database__MigrateOnStartup: "true"
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      Oidc__Authority: ${OIDC_AUTHORITY:?set OIDC_AUTHORITY in .env}
      Oidc__ClientId: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID in .env}
      Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:-}
      Oidc__Scope: ${OIDC_SCOPE:-openid profile email}
      Bootstrap__SystemAdministrators: ${BOOTSTRAP_SYSTEM_ADMINISTRATORS:-}
      # Secure cookies need HTTPS as seen by the backend: trust X-Forwarded-Proto/-For. The backend
      # is reachable only on the internal network, through the gateway.
      Session__SecureCookies: "true"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DataProtection__KeysDirectory: /var/lib/tacticalboard/keys
      Logging__LogLevel__Default: ${BACKEND_LOG_LEVEL:-Information}
    volumes:
      # Data-protection keys: without them every recreation of the container logs everyone out.
      - backend-keys:/var/lib/tacticalboard/keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl/wget; bash's /dev/tcp asks GET /api/health (200 = healthy).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /api/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          && head -n 1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: tacticalboard
      POSTGRES_USER: tacticalboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacticalboard -d tacticalboard"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  backend-keys:
